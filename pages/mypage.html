<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 정보</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body data-require-auth="true">

  <header id="nav"></header>

  <main>
    <section class="page-hero">
      <span class="page-hero__symbol" aria-hidden="true">🍃</span>
      <h1>나의 숲 기록</h1>
      <p>내 계정 정보와 숲에 남긴 이야기를 확인해 보세요.</p>
    </section>

    <section class="card forest-card" aria-label="내 활동 요약">
      <div class="stats-grid">
        <div class="stat-card">
          <span>로그인 계정</span>
          <strong id="myEmail"></strong>
        </div>
        <div class="stat-card">
          <span>내가 남긴 이야기</span>
          <strong class="stat-value"><span id="myCount">-</span>개</strong>
        </div>
      </div>
    </section>

    <section class="card forest-card">
      <h2>🌱 내가 쓴 글</h2>
      <ul id="myList"></ul>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/mypage.js"></script>

</body>
</html>
