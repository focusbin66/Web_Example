<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>내 정보</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    #myPostsMap { height: 380px; border: 3px solid #cbdab7; border-radius: 18px; }
    .mypage-post-image { display: block; width: 100%; max-height: 300px; object-fit: cover; border-radius: 14px; margin: 12px 0; cursor: pointer; }
    .mypage-post-content { white-space: pre-wrap; overflow-wrap: anywhere; }
    .mypage-post-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    #savedList { display: grid; gap: 14px; list-style: none; padding: 0; }
    .saved-post-card { padding: 16px; border: 1px solid #d5e1c4; border-radius: 14px; cursor: pointer; }
    .saved-post-card:hover { background: rgba(232, 240, 217, 0.5); }
    .saved-post-card h3 { margin-top: 0; }
    .korok-probability { display: inline-block; padding: 8px 12px; border-radius: 999px; background: #e7f0d5; color: #315d3b; }
  </style>
</head>
<body data-require-auth="true">

  <header id="nav"></header>

  <main>
    <section class="page-hero">
      <span class="page-hero__symbol" aria-hidden="true">🍃</span>
      <h1>나의 숲 기록</h1>
      <p>내 계정 정보와 숲에 남긴 이야기를 확인해 보세요.</p>
    </section>

    <section class="card forest-card" aria-label="내 활동 요약">
      <div class="stats-grid">
        <div class="stat-card">
          <span>로그인 계정</span>
          <strong id="myEmail"></strong>
        </div>
        <div class="stat-card">
          <span>내가 남긴 이야기</span>
          <strong class="stat-value"><span id="myCount">-</span>개</strong>
        </div>
      </div>
    </section>

    <section class="card forest-card">
      <h2>♡ 내가 저장한 글</h2>
      <ul id="savedList" aria-live="polite"><li>저장한 글을 불러오는 중...</li></ul>
    </section>

    <section class="card forest-card">
      <h2>🗺️ 내가 등록한 장소 지도</h2>
      <p id="myMapStatus" class="map-description" aria-live="polite">지도를 불러오는 중...</p>
      <div id="myPostsMap" aria-label="내 게시글 위치 지도"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="/static/js/common.js"></script>
  <script src="/static/js/mypage.js"></script>

</body>
</html>
