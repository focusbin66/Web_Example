
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코로그 숲 게시판</title>

  <link rel="stylesheet" href="/static/css/style.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    :root {
      --forest-dark: #254b35;
      --forest-green: #4e8053;
      --forest-light: #e8f0d9;
      --forest-cream: #fbf8e9;
      --forest-brown: #796344;
    }

    body {
      background:
        radial-gradient(ellipse at top, #f0f5df 0%, #fbf8e9 65%);
      color: var(--forest-dark);
    }

    main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 28px 20px 60px;
    }

    .forest-hero {
      text-align: center;
      padding: 30px 16px 24px;
    }

    .forest-symbol {
      font-size: 56px;
      line-height: 1.3;
      margin-bottom: 8px;
    }

    .forest-hero h1 {
      color: var(--forest-dark);
      font-size: clamp(27px, 5vw, 40px);
      margin: 8px 0;
    }

    .forest-hero p {
      color: #71836b;
      line-height: 1.7;
      margin: 0;
    }

    .forest-card {
      background: rgba(255, 255, 248, 0.95);
      border: 2px solid #d5e1c4;
      border-radius: 22px;
      padding: 24px;
      margin: 22px 0;
      box-shadow: 0 6px 0 rgba(70, 100, 55, 0.08);
    }

    .forest-card h2 {
      margin: 0 0 10px;
      color: var(--forest-dark);
    }

    .forest-card p {
      line-height: 1.7;
    }

    .forest-card input {
      width: 100%;
      box-sizing: border-box;
      margin: 7px 0;
      padding: 13px 14px;
      border: 1px solid #cad8b9;
      border-radius: 12px;
      background: #fffef8;
      font-size: 15px;
    }

    .forest-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .forest-buttons button,
    .forest-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 0;
      border-radius: 999px;
      background: var(--forest-green);
      color: white;
      padding: 12px 20px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s, background 0.15s;
    }

    .forest-buttons button:hover,
    .forest-link:hover {
      background: var(--forest-dark);
      transform: translateY(-2px);
    }

    .map-heading {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .map-heading span {
      font-size: 28px;
    }

    .map-description {
      color: #71836b;
      font-size: 14px;
      line-height: 1.7;
    }

    #homeMap {
      width: 100%;
      height: 500px;
      margin-top: 18px;
      border: 3px solid #cbdab7;
      border-radius: 18px;
      overflow: hidden;
      z-index: 1;
      background: #e5edcf;
    }

    #mapStatus {
      margin: 12px 0 0;
      color: #71836b;
      font-size: 14px;
    }

    .map-filter {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 16px;
    }

    .map-filter select {
      min-width: 210px;
      padding: 10px 12px;
      border: 1px solid #cad8b9;
      border-radius: 12px;
      background: #fffef8;
      color: var(--forest-dark);
      font: inherit;
    }

    #showMyLocationBtn {
      margin-top: 14px;
      padding: 10px 16px;
      border: 0;
      border-radius: 999px;
      background: var(--forest-green);
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    #showMyLocationBtn:hover { background: var(--forest-dark); }

    #locationStatus {
      min-height: 1.5em;
      margin: 8px 0 0;
      color: #71836b;
      font-size: 14px;
    }

    .map-popup {
      width: min(205px, calc(100vw - 120px));
      max-width: none;
      max-height: calc(100vh - 120px);
      max-height: calc(100dvh - 120px);
      color: #314b34;
      overflow-wrap: anywhere;
      overflow-y: auto;
      box-sizing: border-box;
      padding-right: 4px;
    }

    .map-popup strong {
      color: #315d3b;
    }

    .map-popup p {
      white-space: pre-wrap;
      line-height: 1.5;
    }

    .map-popup img {
      display: block;
      width: 100%;
      max-height: 110px;
      object-fit: contain;
      border-radius: 10px;
      margin-top: 8px;
    }

    .map-visit {
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      background: #f1f8e9;
      color: #314b34;
    }

    .map-visit__count { margin: 0 0 8px; font-weight: 700; }
    .map-visit__control { display: flex; align-items: center; gap: 8px; font-weight: 700; cursor: pointer; }
    .map-visit__control input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .map-visit__track { position: relative; display: inline-block; flex: 0 0 46px; width: 46px; height: 26px; border-radius: 999px; background: #aab5a0; transition: background 0.2s; }
    .map-visit__track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px #0003; transition: transform 0.2s; }
    .map-visit__control input:checked + .map-visit__track { background: #4e8053; }
    .map-visit__control input:checked + .map-visit__track::after { transform: translateX(20px); }
    .map-visit__control input:focus-visible + .map-visit__track { outline: 3px solid #2478e5; outline-offset: 2px; }
    .map-visit__control input:disabled + .map-visit__track { opacity: 0.6; cursor: wait; }
    .map-visit__message { margin: 6px 0 0; font-size: 12px; }

    .map-popup a {
      color: #47784b;
      font-weight: bold;
    }

    .map-popup .map-popup__board-link {
      display: inline-block;
      margin: 6px 0 4px;
      padding: 7px 12px;
      border-radius: 999px;
      background: #4e8053;
      color: #fff;
      text-decoration: none;
    }

    /* 오리지널 잎사귀 마커 */
    .korok-marker {
      background: transparent;
      border: none;
    }

    .korok-leaf {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background: #b9d77e;
      border: 3px solid #527743;
      border-radius: 9px 24px 9px 24px;
      box-shadow: 0 4px 0 rgba(47, 79, 43, 0.3);
      transform: rotate(-12deg);
      box-sizing: border-box;
    }

    .korok-leaf::before {
      content: "";
      position: absolute;
      width: 3px;
      height: 25px;
      background: #527743;
      opacity: 0.7;
      transform: rotate(38deg);
    }

    .korok-eyes {
      position: relative;
      z-index: 1;
      color: #29452c;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 2px;
      transform: rotate(12deg);
    }

    @media (max-width: 600px) {
      main {
        padding: 14px 12px 40px;
      }

      .forest-card {
        padding: 18px;
        border-radius: 18px;
      }

      #homeMap {
        height: 380px;
      }

      .forest-buttons {
        flex-direction: column;
      }

      .forest-buttons button,
      .forest-link {
        width: 100%;
        box-sizing: border-box;
      }
    }
  </style>
</head>

<body>
  <header id="nav"></header>

  <main>
    <section class="forest-hero">
      <div class="forest-symbol" aria-hidden="true">🌿</div>
      <h1>코로그 숲 게시판</h1>
      <p>
        작은 이야기들을 남기고,<br>
        숲 곳곳에 숨겨진 흔적을 찾아보세요.
      </p>
    </section>

    <!-- 로그인 안 했을 때 -->
    <section id="loginBox" class="forest-card" hidden>
      <h2>🌱 숲에 들어가기</h2>
      <p class="map-description">
        로그인하면 게시판에 글을 남길 수 있어요.
      </p>

      <input
        id="email"
        type="email"
        placeholder="이메일"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="비밀번호 (6자 이상)"
        autocomplete="current-password"
      >

      <div class="forest-buttons">
        <button type="button" onclick="signUp()">회원가입</button>
        <button type="button" onclick="signIn()">로그인</button>
      </div>

    </section>

    <!-- 로그인했을 때 -->
    <section id="welcomeBox" class="forest-card" hidden>
      <h2>🍃</h2>
      <p id="hello"></p>

      <a class="forest-link" href="/pages/board.html">
        게시판으로 가기 →
      </a>
    </section>

    <!-- 전체 게시글 지도 -->
    <section class="forest-card home-map-section">
      <div class="map-heading">
        <span aria-hidden="true">🗺️</span>
        <h2>숲속 이야기 지도</h2>
      </div>

      <p class="map-description">
        게시글에 등록된 위치가 잎사귀 마커로 표시돼요.<br>
        마커를 누르면 그곳에 남겨진 이야기를 볼 수 있습니다.
      </p>

      <div class="map-filter">
        <label for="probabilityFilter">코로그 발견 가능성 필터</label>
        <select id="probabilityFilter">
          <option value="all">전체 확률</option>
          <option value="0-20">0~20%</option>
          <option value="21-40">21~40%</option>
          <option value="41-60">41~60%</option>
          <option value="61-80">61~80%</option>
          <option value="81-100">81~100%</option>
          <option value="none">퍼센트 분석 없음</option>
        </select>
      </div>
      <p class="map-description">사진을 바탕으로 한 AI 추정이며 실제 확률이 아닙니다.</p>

      <button id="showMyLocationBtn" type="button">📍 현재 내 위치 표시</button>
      <p id="locationStatus" aria-live="polite"></p>

      <div id="homeMap" aria-label="게시글 위치 지도"></div>

      <p id="mapStatus" class="map-description" aria-live="polite">
        지도를 불러오는 중...
      </p>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/home.js"></script>

</body>
</html>
