<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코로그 게시판</title>

  <link rel="stylesheet" href="/static/css/style.css">

  <style>
    #list {
      list-style: none;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .post-card {
      cursor: pointer;
      padding: 16px;
      border-radius: 12px;
      background: var(--card-bg, #fff);
      border: 1px solid #ddd;
    }

    .post-card:hover {
      transform: translateY(-2px);
    }

    .post-image {
      width: 100%;
      max-width: 400px;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    .post-meta {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 8px;
    }

    /* 팝업 배경 */
    #postModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #postModal.open {
      display: flex;
    }

    .modal-content {
      background: white;
      color: #222;
      width: min(600px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
      position: relative;
    }

    #closeModal {
      position: sticky;
      top: 0;
      float: right;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 20px;
    }

    #modalImage {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      margin: 12px 0;
    }

    #modalLocation {
      margin-top: 12px;
      font-size: 14px;
    }

    #modalAnalysis {
      margin-top: 16px;
      padding: 12px;
      background: #f1f8e9;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    #modalContent {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    @media (prefers-color-scheme: dark) {
      .modal-content {
        background: #202820;
        color: #f3f3f3;
      }

      #modalAnalysis {
        background: #2c3a2a;
      }
    }
  </style>
</head>

<body data-require-auth="true">

  <header id="nav"></header>

  <main>
    <h1>🌿 코로그 제보 게시판</h1>

    <!-- AI 검색 -->
    <section class="card">
      <h2>AI 검색</h2>

      <p>게시판 내용을 자연어로 검색할 수 있어요.</p>

      <div class="row">
        <input
          id="aiSearchInput"
          type="text"
          placeholder="예: 나무 근처 제보 찾아줘"
          autocomplete="off"
        >

        <button
          id="aiSearchBtn"
          type="button"
          onclick="aiSearchPosts()"
        >
          AI 검색
        </button>
      </div>

      <div id="aiSearchResult"></div>
    </section>

    <!-- 게시글 목록 -->
    <section>
      <h2>📍 발견 기록</h2>
      <ul id="list"></ul>
    </section>
  </main>

  <!-- 게시글 팝업 -->
  <div id="postModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="closeModal" type="button" aria-label="닫기">
        ×
      </button>

      <h2 id="modalTitle">🌱 발견 기록</h2>

      <img id="modalImage" alt="제보 사진">

      <p id="modalContent"></p>

      <div id="modalMeta" class="post-meta"></div>

      <div id="modalLocation"></div>

      <div id="modalAnalysis" hidden>
        <h3>🍃 AI 사진 분석</h3>
        <p id="modalAnalysisText"></p>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 공통 JS -->
  <script src="/static/js/common.js"></script>

  <!-- 게시판 JS -->
  <script src="/static/js/board.js"></script>

</body>
</html>
