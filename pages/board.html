<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>코로그 게시판</title>

  <link rel="stylesheet" href="/static/css/style.css">
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  >

  <style>
    #list {
      list-style: none;
      padding: 0;
      display: grid;
      gap: 14px;
    }

    .post-card {
      cursor: pointer;
      padding: 16px;
      margin: 0;
      border-radius: 12px;
      background: rgba(255, 255, 248, 0.95);
      border: 1px solid #d5e1c4;
    }

    .post-card:hover {
      transform: translateY(-2px);
    }

    .post-image {
      width: 100%;
      max-width: 400px;
      max-height: 260px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
    }

    .post-meta {
      font-size: 13px;
      opacity: 0.7;
      margin-top: 8px;
    }

    /* 팝업 배경 */
    #postModal {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.65);
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    #postModal.open {
      display: flex;
    }

    .modal-content {
      background: #fbf8e9;
      color: #254b35;
      width: min(600px, 100%);
      max-height: 85vh;
      overflow-y: auto;
      border-radius: 18px;
      padding: 22px;
      position: relative;
    }

    #closeModal {
      position: sticky;
      top: 0;
      float: right;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      cursor: pointer;
      font-size: 20px;
    }

    #modalImage {
      display: none;
      width: 100%;
      max-height: 350px;
      object-fit: contain;
      border-radius: 12px;
      margin: 12px 0;
    }

    #modalLocation {
      margin-top: 12px;
      font-size: 14px;
    }

    #modalAnalysis {
      margin-top: 16px;
      padding: 12px;
      background: #f1f8e9;
      border-radius: 10px;
      white-space: pre-wrap;
    }

    #modalContent {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #postMap {
      height: 280px;
      margin: 12px 0;
      border-radius: 10px;
      z-index: 0;
    }

    #imagePreview {
      display: none;
      width: 100%;
      max-height: 280px;
      object-fit: contain;
      margin: 8px 0 12px;
      border-radius: 10px;
    }

    #imageAnalysisResult,
    #aiBox {
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .write-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 8px 0 16px;
    }

    .write-actions button:last-child {
      margin-left: auto;
    }

    @media (prefers-color-scheme: dark) {
      .modal-content {
        background: #202820;
        color: #f3f3f3;
      }

      #modalAnalysis {
        background: #2c3a2a;
      }
    }
  </style>
</head>

<body data-require-auth="true">

  <header id="nav"></header>

  <main>
    <section class="page-hero">
      <span class="page-hero__symbol" aria-hidden="true">🌿</span>
      <h1>코로그 제보 게시판</h1>
      <p>숲에서 발견한 작은 흔적과 이야기를 함께 나눠요.</p>
    </section>

    <!-- 게시글 작성 -->
    <section class="card forest-card" aria-labelledby="writeHeading">
      <h2 id="writeHeading">새 제보 작성</h2>

      <label for="content">발견한 내용을 적어 주세요</label>
      <textarea
        id="content"
        rows="5"
        maxlength="3000"
        placeholder="어디에서 무엇을 발견했는지 적어 주세요."
        required
      ></textarea>

      <div class="write-actions">
        <button id="aiBtn" type="button" onclick="polish()">
          AI 문장 다듬기
        </button>
      </div>
      <div id="aiBox" aria-live="polite"></div>

      <label for="imageFile">사진 첨부 (선택, 10MB 이하)</label>
      <input
        id="imageFile"
        type="file"
        accept="image/*"
      >
      <img id="imagePreview" alt="첨부 사진 미리보기">

      <div class="write-actions">
        <button id="analyzeImageBtn" type="button" disabled>
          사진 AI 분석
        </button>
        <button id="useImageAnalysisBtn" type="button" disabled>
          분석 결과를 내용에 넣기
        </button>
      </div>
      <div id="imageAnalysisResult" aria-live="polite"></div>

      <h3>발견 위치 (선택)</h3>
      <button type="button" onclick="useMyLocation()">
        현재 위치 사용
      </button>
      <p id="selectedLocation">아직 위치를 선택하지 않았습니다.</p>
      <div id="postMap" aria-label="지도에서 발견 위치 선택"></div>

      <div class="write-actions">
        <button type="button" onclick="addPost()">
          게시글 등록
        </button>
      </div>
    </section>

    <!-- AI 검색 -->
    <section class="card forest-card">
      <h2>AI 검색</h2>

      <p>게시판 내용을 자연어로 검색할 수 있어요.</p>

      <div class="row">
        <input
          id="aiSearchInput"
          type="text"
          placeholder="예: 나무 근처 제보 찾아줘"
          autocomplete="off"
        >

        <button
          id="aiSearchBtn"
          type="button"
          onclick="aiSearchPosts()"
        >
          AI 검색
        </button>
      </div>

      <div id="aiSearchResult"></div>
    </section>

    <!-- 게시글 목록 -->
    <section class="forest-card">
      <h2>📍 발견 기록</h2>
      <ul id="list"></ul>
    </section>
  </main>

  <!-- 게시글 팝업 -->
  <div id="postModal" role="dialog" aria-modal="true">
    <div class="modal-content">
      <button id="closeModal" type="button" aria-label="닫기">
        ×
      </button>

      <h2 id="modalTitle">🌱 발견 기록</h2>

      <img id="modalImage" alt="제보 사진">

      <p id="modalContent"></p>

      <div id="modalMeta" class="post-meta"></div>

      <div id="modalLocation"></div>

      <div id="modalAnalysis" hidden>
        <h3>🍃 AI 사진 분석</h3>
        <p id="modalAnalysisText"></p>
      </div>
    </div>
  </div>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- 공통 JS -->
  <script src="/static/js/common.js"></script>

  <!-- 지도 -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- 게시판 JS -->
  <script src="/static/js/board.js"></script>

</body>
</html>
